<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impresoras Virtuales — Resto</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ── */
  header {
    background: #1e293b;
    border-bottom: 1px solid #334155;
    padding: 10px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-shrink: 0;
  }
  header h1 { font-size: 15px; font-weight: 700; color: #f8fafc; }
  header h1 span { color: #94a3b8; font-weight: 400; margin-left: 6px; font-size: 13px; }

  #ws-status {
    display: flex; align-items: center; gap: -6px; font-size: 12px; color: #94a3b8;
  }
  #ws-dot {
    width: 8px; height: 8px; border-radius: 50%; background: #ef4444;
    display: inline-block; margin-right: 6px;
    transition: background .3s;
  }
  #ws-dot.ok { background: #22c55e; animation: pulse 2s infinite; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .4; }
  }

  #mode-badge {
    font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px;
    background: #1d4ed8; color: #bfdbfe;
  }
  #mode-badge.prod { background: #166534; color: #bbf7d0; }

  /* ── Grid de impresoras ── */
  #grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0;
    overflow: hidden;
  }

  /* ── Panel de impresora ── */
  .printer {
    display: flex;
    flex-direction: column;
    border-right: 1px solid #1e293b;
    overflow: hidden;
  }
  .printer:last-child { border-right: none; }

  .printer-header {
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    border-bottom: 1px solid rgba(255,255,255,.07);
  }
  .printer-icon {
    font-size: 24px;
    line-height: 1;
  }
  .printer-info { flex: 1; min-width: 0; }
  .printer-name {
    font-size: 14px;
    font-weight: 700;
    color: #f8fafc;
  }
  .printer-meta {
    font-size: 11px;
    color: #64748b;
    margin-top: 2px;
    font-family: monospace;
  }
  .printer-counter {
    font-size: 11px;
    color: #94a3b8;
    background: #1e293b;
    padding: 2px 8px;
    border-radius: 999px;
    font-weight: 600;
  }
  .printer-status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #334155;
    flex-shrink: 0;
  }
  .printer-status-dot.listening { background: #22c55e; }
  .printer-status-dot.receiving { background: #f59e0b; animation: blink .4s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* Actions bar */
  .printer-actions {
    padding: 6px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    border-bottom: 1px solid rgba(255,255,255,.05);
  }
  .btn-clear {
    font-size: 11px;
    background: none;
    border: 1px solid #334155;
    color: #64748b;
    padding: 3px 10px;
    border-radius: 6px;
    cursor: pointer;
    transition: all .15s;
  }
  .btn-clear:hover { border-color: #ef4444; color: #ef4444; background: #450a0a; }

  /* ── Lista de jobs ── */
  .jobs-container {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    scrollbar-width: thin;
    scrollbar-color: #334155 transparent;
  }

  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: #334155;
    font-size: 13px;
  }
  .empty-state .icon { font-size: 36px; opacity: .4; }

  /* ── Ticket / Job ── */
  .job {
    background: #fafafa;
    color: #1e293b;
    border-radius: 6px;
    overflow: hidden;
    animation: slideIn .2s ease;
    box-shadow: 0 1px 3px rgba(0,0,0,.4);
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .job-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 5px 10px;
    font-size: 10px;
    font-weight: 700;
    color: #fff;
  }
  .job-num { opacity: .85; }
  .job-time { opacity: .75; font-weight: 400; }

  .job-from {
    padding: 3px 10px;
    font-size: 10px;
    color: #64748b;
    background: #f1f5f9;
    font-family: monospace;
    border-bottom: 1px dashed #e2e8f0;
  }

  .job-body {
    padding: 10px;
    font-family: 'Courier New', Courier, monospace;
    font-size: 12px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-all;
    color: #1e293b;
    background: #fafafa;
    min-height: 40px;
  }

  .job-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 10px;
    background: #f8fafc;
    border-top: 1px dashed #e2e8f0;
    font-size: 10px;
    color: #94a3b8;
  }

  /* ── Notificación de conexión ── */
  .conn-notice {
    font-size: 11px;
    color: #475569;
    text-align: center;
    padding: 4px 8px;
    background: #f8fafc;
    border-radius: 4px;
    border: 1px dashed #cbd5e1;
    font-family: monospace;
    animation: slideIn .2s ease;
  }
</style>
</head>
<body>

<header>
  <div style="display:flex;align-items:center;gap:10px">
    <h1>🖨️ Impresoras Virtuales <span>— Sistema Resto</span></h1>
    <span id="mode-badge">DEV</span>
  </div>
  <div id="ws-status">
    <span id="ws-dot"></span>
    <span id="ws-label">Conectando...</span>
  </div>
</header>

<div id="grid">
  <!-- Generado por JS -->
</div>

<script>
// ─── Estado ───────────────────────────────────────────────────────────────────
let printers = [];
let jobs = {};       // { printerId: [ ...jobs ] }
let ws = null;

// ─── Bootstrap ────────────────────────────────────────────────────────────────
async function init() {
    try {
        const res  = await fetch('/api/config');
        const data = await res.json();
        printers   = data.printers;

        printers.forEach(p => { jobs[p.id] = []; });

        renderGrid();
        connectWS();

        if (data.printers[0]?.isProd) {
            document.getElementById('mode-badge').textContent = 'PRODUCCIÓN';
            document.getElementById('mode-badge').classList.add('prod');
        }
    } catch(e) {
        console.error('Error init:', e);
    }
}

// ─── Renderizar grid ──────────────────────────────────────────────────────────
function renderGrid() {
    const grid = document.getElementById('grid');
    grid.innerHTML = printers.map(p => `
        <div class="printer" id="printer-${p.id}" style="background:${hexToPanel(p.color)}">
            <div class="printer-header" style="background:${p.color}18">
                <span class="printer-icon">${p.emoji}</span>
                <div class="printer-info">
                    <div class="printer-name">${p.name}</div>
                    <div class="printer-meta">${p.ip}:${p.port}</div>
                </div>
                <span class="printer-counter" id="counter-${p.id}">0 jobs</span>
                <span class="printer-status-dot listening" id="dot-${p.id}" title="Escuchando"></span>
            </div>
            <div class="printer-actions">
                <span style="font-size:11px;color:#64748b">Puerto activo: <b style="color:#94a3b8">${p.port}</b></span>
                <button class="btn-clear" onclick="clearJobs('${p.id}')">Limpiar</button>
            </div>
            <div class="jobs-container" id="jobs-${p.id}">
                <div class="empty-state" id="empty-${p.id}">
                    <span class="icon">🖨️</span>
                    <span>Esperando trabajos de impresión...</span>
                </div>
            </div>
        </div>
    `).join('');
}

function hexToPanel(hex) {
    // Convierte color hex a fondo muy oscuro para el panel
    return '#0f172a';
}

// ─── WebSocket ────────────────────────────────────────────────────────────────
function connectWS() {
    const url = `ws://${location.host}`;
    ws = new WebSocket(url);

    ws.onopen = () => {
        setWsStatus(true);
        console.log('WebSocket conectado');
    };

    ws.onclose = () => {
        setWsStatus(false);
        // Reconexión automática
        setTimeout(connectWS, 2000);
    };

    ws.onerror = () => setWsStatus(false);

    ws.onmessage = ({ data }) => {
        try {
            const msg = JSON.parse(data);
            handleMessage(msg);
        } catch(e) {}
    };
}

function setWsStatus(connected) {
    const dot   = document.getElementById('ws-dot');
    const label = document.getElementById('ws-label');
    dot.className   = connected ? 'ok' : '';
    label.textContent = connected ? 'Conectado' : 'Reconectando...';
}

// ─── Mensajes ─────────────────────────────────────────────────────────────────
function handleMessage(msg) {
    const printer = printers.find(p => p.id === msg.printerId);
    if (!printer) return;

    if (msg.type === 'connect') {
        addConnNotice(printer, msg.client);
        blinkDot(printer.id);
    }

    if (msg.type === 'job') {
        jobs[printer.id].unshift(msg); // más reciente al tope
        renderJob(printer, msg);
        updateCounter(printer.id);
        blinkDot(printer.id);
    }

    if (msg.type === 'error') {
        console.warn(`[${printer.name}] Error: ${msg.message}`);
    }
}

// ─── Renderizar job ───────────────────────────────────────────────────────────
function renderJob(printer, job) {
    const container = document.getElementById(`jobs-${printer.id}`);
    const empty     = document.getElementById(`empty-${printer.id}`);

    if (empty) empty.remove();

    const time = new Date(job.timestamp).toLocaleTimeString('es-PE', {
        hour: '2-digit', minute: '2-digit', second: '2-digit'
    });

    const el = document.createElement('div');
    el.className = 'job';
    el.id = `job-${printer.id}-${job.jobNum}`;
    el.innerHTML = `
        <div class="job-header" style="background:${printer.color}">
            <span class="job-num">Job #${job.jobNum}</span>
            <span class="job-time">${time}</span>
        </div>
        <div class="job-from">desde ${esc(job.from)} · ${job.bytes} bytes</div>
        <div class="job-body">${esc(job.text || '(sin texto legible)')}</div>
        <div class="job-footer">
            <span>${new Date(job.timestamp).toLocaleDateString('es-PE')}</span>
            <span>${job.bytes} bytes recibidos</span>
        </div>
    `;

    // Insertar al tope
    container.insertBefore(el, container.firstChild);
    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function addConnNotice(printer, client) {
    const container = document.getElementById(`jobs-${printer.id}`);
    const el = document.createElement('div');
    el.className = 'conn-notice';
    el.textContent = `📡 Conexión entrante: ${client}`;
    container.insertBefore(el, container.firstChild);
    // Auto-remover después de 5 segundos
    setTimeout(() => el.remove(), 5000);
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
function updateCounter(printerId) {
    const count = jobs[printerId].length;
    const el    = document.getElementById(`counter-${printerId}`);
    if (el) el.textContent = count + (count === 1 ? ' job' : ' jobs');
}

function blinkDot(printerId) {
    const dot = document.getElementById(`dot-${printerId}`);
    if (!dot) return;
    dot.className = 'printer-status-dot receiving';
    setTimeout(() => { dot.className = 'printer-status-dot listening'; }, 800);
}

function clearJobs(printerId) {
    jobs[printerId] = [];
    const container = document.getElementById(`jobs-${printerId}`);
    container.innerHTML = `
        <div class="empty-state" id="empty-${printerId}">
            <span class="icon">🖨️</span>
            <span>Esperando trabajos de impresión...</span>
        </div>`;
    updateCounter(printerId);
}

function esc(s) {
    const d = document.createElement('div');
    d.textContent = s ?? '';
    return d.innerHTML;
}

// ─── Arrancar ─────────────────────────────────────────────────────────────────
init();
</script>
</body>
</html>
